name: Material - Build, test and publish

on:
  pull_request:
    paths:
      - "ui-libraries/material/**"
      - ".github/workflows/material*.yaml"
  push:
    branches: [master]
    paths:
      - "ui-libraries/material/**"
      - ".github/workflows/material*.yaml"
  workflow_dispatch:
    inputs:
      deploy_production:
        type: boolean
        description: "Deploy to material.slint.dev \n Only tick this box if you want to deploy the current state of the master branch to material.slint.dev."
        default: false
        required: false
  workflow_call:

    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_API_TOKEN_2:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_ACCOUNT_ID_2:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEYSTORE_BASE64:
        required: true

permissions:
  contents: read

env:
  MATERIAL_ZIP_VERSION: "1.1.0"

jobs:
  material_wasm_demo:
      # Upstream PRs are covered by the workflow_call from ci.yaml; the
      # pull_request trigger serves forks and PRs ci.yaml doesn't cover.
      if: ${{ github.event_name != 'pull_request' || github.repository != 'slint-ui/slint' }}
      uses: ./.github/workflows/material_wasm_gallery.yaml
  material_apk_demo:
      # Needs the Android signing secrets: upstream only.
      if: ${{ github.repository == 'slint-ui/slint' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: ./.github/workflows/material_gallery.yaml
      secrets:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  material_tests:
      # Same dedup as material_wasm_demo: upstream PRs go through ci.yaml.
      if: ${{ github.event_name != 'pull_request' || github.repository != 'slint-ui/slint' }}
      env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_INCREMENTAL: false
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ui-libraries/material
      steps:
          - uses: actions/checkout@v7
          - name: Install Linux dependencies
            if: runner.os == 'Linux'
            run: |
              sudo timeout 600 apt-get update
              sudo timeout 600 apt-get install libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev
            shell: bash
          - name: Install Rust
            uses: dtolnay/rust-toolchain@stable
          - uses: Swatinem/rust-cache@v2
            with:
                key: tests
                save-if: ${{ github.ref == 'refs/heads/master' }}
          - name: Check generated tokens are up to date
            run: cargo run -p material-token-generator -- check
          - name: Build & run tests
            run: cargo test -p material-gallery
          - name: Check generated parity scenes are up to date
            run: cargo run -p material-parity-generator -- --check

  material_parity:
      # Slint-side parity harness on all renderers + Compose harness build.
      # The committed Paparazzi/layoutlib references under
      # ui-libraries/material/parity/compose/references are required:
      # PARITY_REQUIRE_REFS=1 makes the Slint comparisons fail when a
      # reference is missing, stale, or differs.
      if: ${{ github.event_name != 'pull_request' || github.repository != 'slint-ui/slint' }}
      env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_INCREMENTAL: false
          PARITY_REQUIRE_REFS: "1"
          PARITY_ARTIFACT_DIR: target/parity-artifacts
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v7
          - name: Install Linux dependencies
            run: |
              sudo timeout 600 apt-get update
              sudo timeout 600 apt-get install libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libegl1-mesa-dev libgl1-mesa-dri
            shell: bash
          - name: Install Rust
            uses: dtolnay/rust-toolchain@stable
          - uses: actions/setup-java@v4
            with:
                distribution: temurin
                java-version: "21"
          - name: Install Android SDK platform 36
            # The ubuntu-latest runner image ships a preinstalled Android SDK
            # (ANDROID_HOME / ANDROID_SDK_ROOT point at it). setup-android@v3
            # is not used: it runs `sdkmanager tools`, a package removed from
            # cmdline-tools 16.0, and fails on current runner images.
            run: |
              SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
              yes | "$SDKMANAGER" --licenses > /dev/null
              "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
            shell: bash
          - uses: Swatinem/rust-cache@v2
            with:
                key: parity
                save-if: ${{ github.ref == 'refs/heads/master' }}
          - name: Run material parity cases on all renderers
            run: SLINT_TEST_FILTER=material cargo test --manifest-path tests/Cargo.toml -p test-driver-screenshots --features femtovg
          - name: Build the Compose parity harness
            run: ./gradlew compileDebugUnitTestKotlin --no-daemon
            working-directory: ui-libraries/material/parity/compose
          - name: Upload parity artifacts
            if: failure()
            uses: actions/upload-artifact@v7
            with:
                name: material-parity-artifacts
                path: target/parity-artifacts/
                retention-days: 30

  deploy:
    # Builds the docs site and deploys it to Cloudflare: upstream only.
    if: github.repository == 'slint-ui/slint'
    runs-on: ubuntu-latest
    needs: [material_wasm_demo, material_apk_demo, material_tests]
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages

    defaults:
      run:
        working-directory: ui-libraries/material/docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: |
          sudo timeout 600 apt-get update
          sudo timeout 600 apt-get install libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev zip unzip
        shell: bash
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Take screenshots
        # slint-doc-generator lives in the repository root workspace, not the
        # material workspace, so point cargo at the root manifest.
        run: cargo run --manifest-path ../../Cargo.toml -p slint-doc-generator -- screenshots -Lmaterial=$PWD/src/material.slint docs
        working-directory: ui-libraries/material
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          MATERIAL_DOCS_BASE_PATH: ${{ github.event_name == 'pull_request' && '/material/' || '' }}
        run: pnpm build
      - name: Install Playwright
        working-directory: ui-libraries/material/docs
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        working-directory: ui-libraries/material/docs
        env:
          MATERIAL_DOCS_BASE_PATH: ${{ github.event_name == 'pull_request' && '/material/' || '' }}
        run: pnpm exec playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: material-playwright-report
          path: ui-libraries/material/docs/playwright-report/
          retention-days: 30
      - uses: actions/download-artifact@v8
        with:
          name: material_wasm_gallery
          path: ui-libraries/material/docs/dist/wasm
      - uses: actions/download-artifact@v8
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          name: material_gallery
          path: ui-libraries/material/docs/dist/apk
      - name: Normalize APK names
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: ui-libraries/material
        run: |
          if [ -f docs/dist/apk/material-gallery.apk ]; then mv docs/dist/apk/material-gallery.apk docs/dist/apk/slint_material.apk; fi
          if [ -f docs/dist/apk/material-gallery.aab ]; then mv docs/dist/apk/material-gallery.aab docs/dist/apk/slint_material.aab; fi
      - name: Zip material library
        working-directory: ui-libraries/material
        run: |
          mkdir -p docs/dist/zip
          while read -r version; do
            curl -fsSL -o "docs/dist/zip/material-${version}.zip" \
              "https://material.slint.dev/zip/material-${version}.zip"
          done < release/released-versions.txt
          scripts/package-release.sh "$MATERIAL_ZIP_VERSION" docs/dist/zip
      - name: Deploy to materialui (Pages)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'true' && github.ref == 'refs/heads/master'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=materialui --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
          workingDirectory: ui-libraries/material/docs

      - name: Deploy to material-staging (Workers production)
        if: (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_production != 'true') && github.ref == 'refs/heads/master'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
          workingDirectory: ui-libraries/material/docs

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview-material
          path: ui-libraries/material/docs/dist/
