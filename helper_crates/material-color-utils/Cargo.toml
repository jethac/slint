[package]
name = "material-color-utils"
version = "0.1.0"
authors = ["Slint Developers <info@slint.dev>"]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Exact port of material-foundation/material-color-utilities: HCT/CAM16, tonal palettes, dynamic schemes, quantize and score"
repository = "https://github.com/slint-ui/slint"
homepage = "https://slint.dev"
keywords = ["material", "color", "hct", "cam16", "material-you"]

[features]
default = ["std"]
std = []
no_std = []

[dependencies]
# The reference implementations use fdlibm code for transcendentals; libm is a
# faithful fdlibm port, keeping every platform bit-identical.
libm = "0.2"

[dev-dependencies]
flate2 = "1.1.5"
