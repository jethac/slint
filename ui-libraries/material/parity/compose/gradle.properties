android.useAndroidX=true
# AGP's JDK-image transform strips java.* packages Android lacks from the
# compile classpath; Paparazzi frames are java.awt.image.BufferedImage, so
# compile against the real JDK here.
android.disableJdkImageTransform=true

org.gradle.jvmargs=-Xmx3g
org.gradle.caching=true
org.gradle.parallel=false
